name: Tauri Build

on:
  push:
    tags:
      - "v*"
      - "!v*-*"

permissions:
  contents: write

env:
  NODE_VERSION: "lts/*"
  RUST_BACKTRACE: 1

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate app icons
        run: npm run icons

      - name: Build frontend
        run: npm run build

      - name: Build Tauri desktop app
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('OrcaSVN {0}', github.ref_name) || '' }}
          # __VERSION__ is replaced by tauri-action with the app version.
          # Update the highlights below before tagging a new release.
          releaseBody: |-
            ## What's new since v0.6.1

            ### Improvements
            - Unify light/dark colors, typography, controls, file status badges, and scrollbars
            - Simplify the toolbar and improve responsive navigation, welcome screens, and theme selection
            - Support keyboard operation and accessible labels for workspace filters and file selection
            - Reduce page margins to 6px and panel corner radii to 8px

            ### Fixes
            - Prevent repository names and revisions from being vertically clipped; truncate long values and show full text on hover
            - Distinguish an empty workspace from a filter with no matching files
            - Disable developer tools, deny Tauri's internal toggle command, and block inspection shortcuts while preserving editing shortcuts

            ## 自 v0.6.1 以来的更新

            ### 功能改进
            - 统一浅色/深色主题、字体、控件、文件状态徽标与滚动条样式
            - 精简顶部工具栏，优化响应式导航、欢迎页面和主题选择
            - 工作区筛选与文件选择支持键盘操作，补充无障碍标签
            - 页面外边距缩小至 6px，面板圆角缩小至 8px

            ### 问题修复
            - 修复顶部仓库名和版本文字下沿裁切；超长内容省略显示，悬停可查看完整内容
            - 区分工作区没有改动与筛选结果为空的提示
            - 禁用开发者工具及 Tauri 内部切换命令，拦截调试快捷键并保留常用编辑快捷键

            <div align=center>

            [![Release Downloads](https://img.shields.io/github/downloads/wustites/OrcaSVN/v__VERSION__/total?style=flat-square&logo=github)](https://github.com/wustites/OrcaSVN/releases)

            </div>

            **Download based on your OS:**

            <div align=left>
            <table>
                <thead align=left>
                    <tr>
                        <th>OS</th>
                        <th>Download</th>
                    </tr>
                </thead>
                <tbody align=left>
                    <tr>
                        <td>Windows</td>
                        <td>
                            <a href="https://github.com/wustites/OrcaSVN/releases/download/v__VERSION__/OrcaSVN___VERSION___x64-setup.exe"><img src="https://img.shields.io/badge/Setup-x64-2d7d9a.svg?logo=windows"></a><br>
                            <a href="https://github.com/wustites/OrcaSVN/releases/download/v__VERSION__/OrcaSVN___VERSION___x64_en-US.msi"><img src="https://img.shields.io/badge/MSI-x64-0078d4.svg?logo=windows"></a>
                        </td>
                    </tr>
                    <tr>
                        <td>macOS</td>
                        <td>
                            <a href="https://github.com/wustites/OrcaSVN/releases/download/v__VERSION__/OrcaSVN___VERSION___aarch64.dmg"><img src="https://img.shields.io/badge/DMG-Apple%20Silicon-%23000000.svg?logo=apple"></a><br>
                            <a href="https://github.com/wustites/OrcaSVN/releases/download/v__VERSION__/OrcaSVN_aarch64.app.tar.gz"><img src="https://img.shields.io/badge/TGZ-Apple%20Silicon-%23555555.svg?logo=apple"></a>
                        </td>
                    </tr>
                    <tr>
                        <td>Linux</td>
                        <td>
                            <a href="https://github.com/wustites/OrcaSVN/releases/download/v__VERSION__/OrcaSVN___VERSION___amd64.AppImage"><img src="https://img.shields.io/badge/AppImage-x64-f84e29.svg?logo=linux"> </a><br>
                            <a href="https://github.com/wustites/OrcaSVN/releases/download/v__VERSION__/OrcaSVN___VERSION___amd64.deb"><img src="https://img.shields.io/badge/DebPackage-x64-FF9966.svg?logo=debian"> </a><br>
                            <a href="https://github.com/wustites/OrcaSVN/releases/download/v__VERSION__/OrcaSVN-__VERSION__-1.x86_64.rpm"><img src="https://img.shields.io/badge/RpmPackage-x64-F1B42F.svg?logo=redhat"> </a>
                        </td>
                    </tr>
                </tbody>
            </table>

            </div>

            <div dir="ltr">

            **List of all changes:** [GitHub Releases](https://github.com/wustites/OrcaSVN/releases)

            </div>
          releaseDraft: false
          prerelease: false

  publish-to-winget:
    name: Publish to WinGet
    runs-on: windows-latest
    needs: desktop
    continue-on-error: true
    steps:
      - name: Get version from tag
        id: get-version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate WinGet token
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            Write-Output "::error::WINGET_TOKEN is missing. Create a classic GitHub PAT with public_repo scope and save it as the WINGET_TOKEN repository secret."
            exit 1
          }

          try {
            $response = Invoke-RestMethod `
              -Uri "https://api.github.com/user" `
              -Headers @{
                Authorization = "Bearer $env:WINGET_TOKEN"
                Accept = "application/vnd.github+json"
                "X-GitHub-Api-Version" = "2022-11-28"
              }
            Write-Output "WinGet token authenticated as $($response.login)."
          } catch {
            Write-Output "::error::WINGET_TOKEN is invalid for winget-releaser. Use a classic GitHub PAT with public_repo scope; fine-grained PATs are not supported."
            exit 1
          }

      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: OrcaSVN.OrcaSVN
          version: ${{ steps.get-version.outputs.version }}
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: ZeroMarker
          installers-regex: '\.exe$'
